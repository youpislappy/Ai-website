<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               viewport-fit=cover">

<title>AI assistant</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #020306;
    color: white;
}


/* =========================
   APP
========================= */

.app {
    width: 100%;
    height: 100vh;
    height: 100dvh;

    display: flex;

    background:
        radial-gradient(
            circle at 75% 20%,
            rgba(70, 0, 180, 0.12),
            transparent 35%
        ),
        #020306;
}


/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 245px;
    height: 100%;

    padding: 25px 18px;

    background: rgba(5, 7, 12, 0.9);

    border-right:
        1px solid rgba(255,255,255,0.08);

    display: flex;
    flex-direction: column;

    backdrop-filter: blur(20px);
}

.logo {
    font-size: 25px;
    font-weight: 700;

    margin: 5px 10px 30px;

    background: linear-gradient(
        90deg,
        #ff00cc,
        #6c5ce7,
        #00c6ff,
        #00ff88
    );

    background-size: 300% 300%;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation: rainbow 5s linear infinite;
}

.new-chat {
    width: 100%;

    padding: 14px;

    border: 1px solid transparent;

    border-radius: 13px;

    background:
        linear-gradient(#080b12, #080b12)
        padding-box,

        linear-gradient(
            90deg,
            #ff0080,
            #6c5ce7,
            #00c6ff
        )
        border-box;

    color: white;

    font-size: 15px;

    cursor: pointer;

    transition: 0.2s;
}

.new-chat:hover {
    box-shadow:
        0 0 20px rgba(120,80,255,0.3);
}

.new-chat:active {
    transform: scale(0.96);

    box-shadow:
        0 0 30px rgba(0,200,255,0.7);
}


/* =========================
   MENU
========================= */

.menu {
    margin-top: 30px;
}

.menu-button {
    width: 100%;

    padding: 13px 15px;

    margin-bottom: 8px;

    border: 0;

    border-radius: 11px;

    background: transparent;

    color: #9299aa;

    text-align: left;

    font-size: 15px;

    cursor: pointer;

    transition: 0.2s;
}

.menu-button:hover {
    background: rgba(255,255,255,0.05);

    color: white;
}

.menu-button:active {
    transform: scale(0.96);

    background:
        rgba(100,100,255,0.15);
}

.menu-button.active {
    background:
        rgba(80,70,255,0.12);

    color: white;

    box-shadow:
        inset 3px 0 0 #6c5ce7;
}


/* =========================
   STATUS
========================= */

.status-box {
    margin-top: auto;

    padding: 15px;

    border-radius: 13px;

    border:
        1px solid rgba(255,255,255,0.08);

    background:
        rgba(255,255,255,0.025);
}

.status-title {
    font-size: 14px;

    margin-bottom: 6px;
}

.status {
    font-size: 12px;

    color: #35ff88;

    display: flex;

    align-items: center;

    gap: 7px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #35ff88;

    box-shadow:
        0 0 10px #35ff88;

    animation: pulse 1.5s infinite;
}


/* =========================
   MAIN
========================= */

.main {
    flex: 1;

    height: 100%;

    min-height: 0;

    display: flex;

    flex-direction: column;

    min-width: 0;
}


/* =========================
   HEADER
========================= */

.header {
    height: 75px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    padding: 0 25px;

    border-bottom:
        1px solid rgba(255,255,255,0.07);

    background:
        rgba(3,5,9,0.75);

    backdrop-filter: blur(20px);
}

.header-title {
    font-size: 21px;

    font-weight: 600;
}

.header-subtitle {
    margin-top: 4px;

    font-size: 12px;

    color: #7f8798;
}


/* =========================
   THINKING PANEL
========================= */

.thinking-panel {
    margin: 20px 25px 10px;

    min-height: 145px;

    flex-shrink: 0;

    border-radius: 22px;

    border:
        1px solid rgba(255,255,255,0.08);

    background:
        rgba(255,255,255,0.025);

    display: flex;

    align-items: center;

    padding: 25px;

    position: relative;

    overflow: hidden;
}

.thinking-panel::before {
    content: "";

    position: absolute;

    inset: -2px;

    background: linear-gradient(
        90deg,
        #ff006e,
        #7c3cff,
        #00bfff,
        #00ff9d,
        #ffe600,
        #ff006e
    );

    background-size: 300% 100%;

    animation:
        rainbow 5s linear infinite;

    opacity: 0;

    transition: opacity 0.5s;
}

.thinking-panel.thinking::before {
    opacity: 0.7;
}

.thinking-content {
    position: relative;

    width: 100%;

    z-index: 1;

    display: flex;

    align-items: center;

    gap: 25px;

    background:
        rgba(2,3,7,0.92);

    border-radius: 19px;

    padding: 18px;
}


/* =========================
   AI ORB
========================= */

.ai-orb {
    width: 75px;
    height: 75px;

    min-width: 75px;

    border-radius: 50%;

    background: #05070c;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    box-shadow:
        0 0 20px rgba(120,60,255,0.2);

    transition: 0.5s;
}

.ai-orb::before {
    content: "";

    position: absolute;

    inset: -3px;

    border-radius: 50%;

    background: linear-gradient(
        45deg,
        #ff0080,
        #7c3cff,
        #00c6ff,
        #00ff88,
        #ffe600,
        #ff0080
    );

    background-size: 300% 300%;

    z-index: -1;

    animation:
        rainbow 5s linear infinite;
}

.ai-orb.thinking {
    transform: scale(1.08);

    box-shadow:
        0 0 25px #7c3cff,
        0 0 50px rgba(0,200,255,0.3);
}

.orb-center {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 15px white;
}


/* =========================
   THINKING TEXT
========================= */

.thinking-title {
    font-size: 20px;

    font-weight: 600;

    color: #777f91;
}

.thinking-panel.thinking
.thinking-title {

    background: linear-gradient(
        90deg,
        #ff0080,
        #7c3cff,
        #00c6ff,
        #00ff88,
        #ffe600
    );

    background-size: 300% 300%;

    animation:
        rainbow 3s linear infinite;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.thinking-description {
    color: #737b8d;

    font-size: 13px;

    margin-top: 7px;
}


/* =========================
   CHAT
========================= */

.chat {
    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 15px 25px 20px;

    scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
    width: 5px;
}

.chat::-webkit-scrollbar-thumb {
    background: #292e3a;

    border-radius: 10px;
}


/* =========================
   MESSAGES
========================= */

.message {
    display: flex;

    margin: 15px 0;

    animation:
        messageIn 0.35s ease;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 75%;

    padding: 14px 17px;

    border-radius: 17px;

    line-height: 1.5;

    font-size: 14px;

    position: relative;

    transition: 0.3s;

    white-space: pre-wrap;

    word-wrap: break-word;
}

.user .bubble {
    background: #101522;

    border:
        1px solid #2758ff;

    box-shadow:
        0 0 12px rgba(40,100,255,0.15);
}

.user .bubble:hover {
    box-shadow:
        0 0 22px rgba(40,100,255,0.3);
}

.ai .bubble {
    background: #0c1018;

    border:
        1px solid #2a3140;

    box-shadow:
        0 0 12px rgba(255,255,255,0.03);
}

.ai .bubble:hover {
    border-color: #636cff;

    box-shadow:
        0 0 20px rgba(90,80,255,0.2);
}


/* =========================
   TYPING
========================= */

.typing-bubble {
    display: flex;

    gap: 6px;

    padding: 17px 20px;
}

.typing-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #8a8fa0;

    animation:
        typing 1.2s infinite;
}

.typing-dot:nth-child(2) {
    animation-delay: 0.15s;
}

.typing-dot:nth-child(3) {
    animation-delay: 0.30s;
}


/* =========================
   INPUT
========================= */

.input-area {
    flex-shrink: 0;

    padding: 15px 25px 20px;

    background:
        rgba(2,3,7,0.85);

    backdrop-filter: blur(20px);
}

.input-box {
    width: 100%;

    min-height: 62px;

    display: flex;

    align-items: center;

    padding: 8px;

    border-radius: 19px;

    background: #080b12;

    border:
        1px solid #252b36;

    transition: 0.3s;

    position: relative;
}

.input-box:focus-within {
    border-color: #7065ff;

    box-shadow:
        0 0 25px rgba(90,80,255,0.18);
}

#question {
    flex: 1;

    min-width: 0;

    border: 0;

    outline: 0;

    background: transparent;

    color: white;

    font-size: 14px;

    padding: 12px;
}

#question::placeholder {
    color: #666e7d;
}


/* =========================
   SEND BUTTON
========================= */

.send-button {
    width: 46px;
    height: 46px;

    flex-shrink: 0;

    border-radius: 50%;

    border: 0;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #713cff,
            #008cff
        );

    transition: 0.2s;

    color: white;

    font-size: 18px;
}

.send-button:active {
    transform: scale(0.86);

    box-shadow:
        0 0 30px #5c6cff;
}


/* =========================
   ANIMATIONS
========================= */

@keyframes rainbow {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}

@keyframes pulse {

    0%,
    100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: 0.5;
        transform: scale(1.3);
    }

}

@keyframes typing {

    0%,
    60%,
    100% {
        transform: translateY(0);
        opacity: 0.4;
    }

    30% {
        transform: translateY(-5px);
        opacity: 1;
    }

}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    html,
    body {
        width: 100%;
        height: 100%;

        overflow: hidden;
    }

    .app {
        width: 100%;

        height: 100vh;
        height: 100dvh;

        min-height: 0;
    }

    .sidebar {
        display: none;
    }

    .main {
        width: 100%;

        height: 100%;

        min-height: 0;
    }

    .header {
        height: 62px;

        padding: 0 16px;
    }

    .header-title {
        font-size: 18px;
    }

    .thinking-panel {
        margin: 10px 10px 6px;

        min-height: 100px;

        padding: 10px;

        border-radius: 18px;
    }

    .thinking-content {
        padding: 12px;

        gap: 14px;

        border-radius: 15px;
    }

    .ai-orb {
        width: 52px;
        height: 52px;

        min-width: 52px;
    }

    .thinking-title {
        font-size: 16px;
    }

    .thinking-description {
        font-size: 11px;
    }

    .chat {
        min-height: 0;

        padding: 8px 12px 10px;

        overflow-y: auto;
    }

    .bubble {
        max-width: 88%;

        font-size: 14px;
    }

    .input-area {
        width: 100%;

        flex-shrink: 0;

        padding: 8px 10px;

        padding-bottom:
            calc(
                8px +
                env(safe-area-inset-bottom)
            );
    }

    .input-box {
        min-height: 56px;

        border-radius: 17px;
    }

    #question {
        font-size: 14px;

        padding: 10px;
    }

    .send-button {
        width: 42px;
        height: 42px;
    }

}

</style>

</head>


<body>


<div class="app">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            AI assistant
        </div>

        <button
            class="new-chat"
            onclick="newChat()"
        >
            New Chat
        </button>

        <div class="menu">

            <button
                class="menu-button active"
            >
                Chat
            </button>

            <button class="menu-button">
                History
            </button>

            <button class="menu-button">
                Settings
            </button>

            <button class="menu-button">
                About
            </button>

        </div>

        <div class="status-box">

            <div class="status-title">
                AI assistant
            </div>

            <div class="status">

                <span class="status-dot"></span>

                Online

            </div>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">


        <!-- HEADER -->

        <header class="header">

            <div>

                <div class="header-title">
                    AI assistant
                </div>

                <div class="header-subtitle">
                    Your intelligent assistant
                </div>

            </div>

        </header>


        <!-- THINKING PANEL -->

        <section
            class="thinking-panel"
            id="thinkingPanel"
        >

            <div class="thinking-content">

                <div
                    class="ai-orb"
                    id="aiOrb"
                >

                    <div class="orb-center"></div>

                </div>

                <div>

                    <div
                        class="thinking-title"
                        id="thinkingTitle"
                    >
                        Ready
                    </div>

                    <div
                        class="thinking-description"
                        id="thinkingDescription"
                    >
                        Ask me something.
                    </div>

                </div>

            </div>

        </section>


        <!-- CHAT -->

        <section
            class="chat"
            id="chat"
        >

            <div class="message ai">

                <div class="bubble">

                    Hello. How can I help you?

                </div>

            </div>

        </section>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-box">

                <input
                    id="question"
                    type="text"
                    placeholder="Type your message..."
                    autocomplete="off"
                >

                <button
                    class="send-button"
                    id="sendButton"
                    onclick="askAI()"
                >
                    &gt;
                </button>

            </div>

        </div>


    </main>

</div>


<script>

/* =========================
   PUBLIC AI SERVER
========================= */

/*
   IMPORTANT:
   This is your CURRENT
   Cloudflare Quick Tunnel.
*/

const AI_SERVER =
    "https://prophet-bringing-desire-comp.trycloudflare.com";


/* =========================
   ELEMENTS
========================= */

const questionInput =
    document.getElementById("question");

const chat =
    document.getElementById("chat");

const thinkingPanel =
    document.getElementById("thinkingPanel");

const aiOrb =
    document.getElementById("aiOrb");

const thinkingTitle =
    document.getElementById("thinkingTitle");

const thinkingDescription =
    document.getElementById(
        "thinkingDescription"
    );


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text, type) {

    const message =
        document.createElement("div");

    message.className =
        "message " + type;


    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";


    bubble.textContent =
        text;


    message.appendChild(
        bubble
    );


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================
   START THINKING
========================= */

function startThinking() {

    thinkingPanel.classList.add(
        "thinking"
    );

    aiOrb.classList.add(
        "thinking"
    );

    thinkingTitle.textContent =
        "Thinking...";

    thinkingDescription.textContent =
        "Searching for the best answer.";

}


/* =========================
   STOP THINKING
========================= */

function stopThinking() {

    thinkingPanel.classList.remove(
        "thinking"
    );

    aiOrb.classList.remove(
        "thinking"
    );

    thinkingTitle.textContent =
        "Ready";

    thinkingDescription.textContent =
        "Ask me something.";

}


/* =========================
   SHOW TYPING
========================= */

function showTyping() {

    const message =
        document.createElement("div");

    message.className =
        "message ai";

    message.id =
        "typingMessage";


    message.innerHTML = `

        <div class="bubble typing-bubble">

            <span class="typing-dot"></span>

            <span class="typing-dot"></span>

            <span class="typing-dot"></span>

        </div>

    `;


    chat.appendChild(
        message
    );


    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================
   REMOVE TYPING
========================= */

function removeTyping() {

    const typing =
        document.getElementById(
            "typingMessage"
        );

    if (typing) {

        typing.remove();

    }

}


/* =========================
   ASK AI
========================= */

async function askAI() {

    const question =
        questionInput.value.trim();


    if (question === "") {

        return;

    }


    /* Show user message */

    addMessage(
        question,
        "user"
    );


    questionInput.value =
        "";


    /* Start animation */

    startThinking();

    showTyping();


    try {

        const response =
            await fetch(
                AI_SERVER +
                "/ask?q=" +
                encodeURIComponent(
                    question
                )
            );


        if (!response.ok) {

            throw new Error(
                "Server error: " +
                response.status
            );

        }


        const data =
            await response.json();


        removeTyping();

        stopThinking();


        if (
            data &&
            data.answer !== undefined
        ) {

            addMessage(
                String(data.answer),
                "ai"
            );

        } else {

            addMessage(
                "The AI server returned an unexpected response.",
                "ai"
            );

        }


    }

    catch (error) {

        removeTyping();

        stopThinking();


        addMessage(
            "I couldn't connect to the AI server.",
            "ai"
        );


        console.error(
            "AI connection error:",
            error
        );

    }

}


/* =========================
   ENTER TO SEND
========================= */

questionInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            askAI();

        }

    }
);


/* =========================
   NEW CHAT
========================= */

function newChat() {

    chat.innerHTML = `

        <div class="message ai"
